<!doctype html>

<html>

<head>
	<meta charset="utf-8"/>
	<link rel="stylesheet" href="oform.css">
	<title> Contact Me </title>
</head>

<body>
	<div class="ContactHeading">
		<h1>
			Contact Me
			
			
		</h1>
		<h2>
			Contact the Help Team
		</h2>
	</div>
	
	<form name="cOrder" method="post" action="process_form.php">
		<label for="fName">First Name:</label>
		<br><br>
		<input type="text" id="fName" name="fName" required>
		<br><br>
		<label for="lName">Last Name:</label>
		<br><br>
		<input type="text" id="lName" name="lName" required>
		<br><br>
		<label for="street">Street Address</label>
		<br><br>
		<input type="text" id="street" name="street" required>
		<br><br>
		<label for="city">City:</label>
		<br><br>
		<input type="text" id="city" name="city" required>
		<br><br>
		<label for="province">Province:</label>
		<br><br>
		<input type="text" id="province" name="province" required>
		<br><br>
		<label for="postcode">Postal Code:</label>
		<br><br>
		<input type ="text" id="postcode" name="postcode" 
		pattern="[A-Za-Z][0-9][A-Za-z] ?[0-9][A-Za-z][0-9]" 
		placeholder="A1A 1A1" required>
		<br><br>
		<label for="phone">Phone Number:</label>
		<br><br>
		<input type ="text" id="phone" name="phone"
		pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
		placeholder="(555)-555-5555">
		<br><br>
		<label for="role">Select Role:</label>
		<br><br>
		<select id="role" name="role">
			<option value="student">Student</option>
			<option value="parent">Parent</option>
			<option value="dancer">Dancer</option>
			<option value="performer">Performer</option>
		</select>
		<br><br>
		<label for="comments">Additional info and comments:</label>
		<br><br>
		<textarea id="comments" name="comments" rows="10" cols="30" placeholder="Comments and additional info"></textarea>
		<br><br>
		
		<button class="submitButton" type="submit">Submit Details</button>
		<button class="cancelButton"type="reset">Cancel Details</button>
		
	</form>
</body>

</html>
